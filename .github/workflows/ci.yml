name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Start PostgreSQL
        run: |
          docker run --name work-schedule-ai-postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 55432:5432 \
            -d postgres:16
          for i in {1..30}; do
            if docker exec work-schedule-ai-postgres pg_isready -U postgres; then
              docker ps --filter name=work-schedule-ai-postgres
              exit 0
            fi
            sleep 1
          done
          docker logs work-schedule-ai-postgres
          exit 1
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,deploy]"
      - name: Diagnose backend database URL
        run: |
          python - <<'PY'
          import os
          from sqlalchemy.engine import make_url

          url = make_url(os.environ["TEST_POSTGRES_URL"])
          print(
              f"TEST_POSTGRES_URL host={url.host} "
              f"port={url.port} database={url.database} username={url.username}"
          )
          PY
      - name: Verify PostgreSQL connection
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["TEST_POSTGRES_URL"])
          with engine.connect() as connection:
              connection.execute(text("SELECT 1"))
          engine.dispose()
          PY
      - name: Run backend tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build
